ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    frame_id: laser_link          # matches yahboomcar_X3.urdf.xacro laser_link frame
    ignore_array: ""
    baudrate: 512000              # from drivers_x3.py BAUDRATE
    lidar_type: 0                 # TYPE_TOF (from drivers_x3.py ydlidar.TYPE_TOF)
    device_type: 0                # SERIAL
    isSingleChannel: true         # from drivers_x3.py LidarPropSingleChannel=True
    intensity: false
    sample_rate: 20               # kHz — from drivers_x3.py SAMPLE_RATE
    abnormal_check_count: 4
    # MUST be true for SLAM. The X3 spins at a slightly variable rate, so with a free
    # resolution each revolution yields a different number of samples (observed 2802-2871
    # against a 2791 nominal). slam_toolbox's Karto backend registers the LaserRangeFinder
    # once, from the first scan, and then REJECTS every scan whose beam count differs —
    # so the map builds from the first scan or two and then silently stops updating
    # forever ("LaserRangeScan contains N range readings, expected M" in the SLAM log).
    # Fixing the resolution pads each scan to a constant size, which every consumer here
    # already tolerates: the padding is 0.0 (invalid_range_is_inf is false) and all the
    # scan loops skip r below their minimum gate.
    fixed_resolution: true
    reversion: false
    inverted: true                # FLIP_HORIZONTAL=True in our driver
    auto_reconnect: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 10.0
    range_min: 0.12
    frequency: 8.0                # SCAN_FREQ from drivers_x3.py
    invalid_range_is_inf: false
    debug: false

slam_toolbox:
  ros__parameters:
    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint    # matches Yahboom X3 URDF convention

    # Input
    scan_topic: /scan
    use_scan_barycenter: true

    # Mode: online async mapping
    mode: mapping

    # Resolution and range
    resolution: 0.05
    max_laser_range: 8.0
    # The YDLidar sits low (laser_joint z=0.11 m) and its rear/side beams strike the
    # robot's own body and the two mount posts at +24 deg / -18 deg, ~0.26-0.35 m.
    # Those returns are fixed in the ROBOT frame, so while mapping they smear a ring of
    # phantom obstacles along the driven path AND bias scan matching toward "no motion"
    # (the self-returns never move between scans). Nothing structural in an indoor room
    # is closer than 0.4 m, so drop everything below that when building the map. This is
    # scoped to slam_toolbox only — the raw /scan and the manual-drive CBF filter are
    # untouched. Revert to 0.0 once the lidar is raised (see LIDAR_MOUNT_PLAN.md).
    min_laser_range: 0.40

    # Minimum movement before updating the map (reduces CPU during drift)
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1

    # Loop closure
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Timing
    transform_publish_period: 0.02   # 50 Hz TF
    map_update_interval: 0.5         # seconds between map saves/updates
    tf_buffer_duration: 30.0

    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    use_sim_time: false
    debug_logging: false

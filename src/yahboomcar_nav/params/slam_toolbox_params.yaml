slam_toolbox:
  ros__parameters:
    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint    # matches Yahboom X3 URDF convention

    # Input — the RESAMPLED scan, not raw /scan. Karto registers the laser once from
    # the first scan and rejects every later one whose beam count differs; the X3's
    # count varies each revolution. scan_resampler republishes /scan on a fixed grid.
    scan_topic: /scan_fixed
    use_scan_barycenter: true

    # Mode: online async mapping
    mode: mapping

    # Resolution and range
    resolution: 0.05
    max_laser_range: 8.0
    # Left at the default. An earlier revision raised this to 0.40 to reject lidar
    # self-returns off the chassis, but that was based on a stale note describing the
    # old low mount (laser_joint z=0.11 m). The lidar has since been raised to z=0.191 m,
    # and a 360-degree coverage sweep on 2026-08-08 found ZERO returns below 0.40 m in
    # any bearing bin — self-returns are pose-independent, so zero of them proves the
    # chassis is no longer reflecting. Filtering here would only discard genuine returns
    # from furniture the robot passes close to, which in a small apartment is common.
    min_laser_range: 0.0

    # Minimum movement before updating the map (reduces CPU during drift)
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1

    # Loop closure
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Timing
    transform_publish_period: 0.02   # 50 Hz TF
    map_update_interval: 0.5         # seconds between map saves/updates
    tf_buffer_duration: 30.0

    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    use_sim_time: false
    debug_logging: false

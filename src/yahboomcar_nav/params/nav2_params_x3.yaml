# nav2_params_x3.yaml
# Nav2 stack tuned for the Yahboom X3 4-wheel mecanum (holonomic) robot.
#
# Stack:
#   Global planner : SmacPlanner2D   (no non-holonomic constraints)
#   Smoother       : SavitzkyGolay   (smooths global path before controller)
#   Controller     : MPPI            (holonomic: allows strafing + reverse)
#   Localization   : AMCL with OmniMotionModel
#
# use_sim_time is set by the launch file at runtime.
# All "False" entries below are the hardware default; the launch file overrides
# them via the lifecycle manager's use_sim_time launch argument.

amcl:
  ros__parameters:
    use_sim_time: False
    # Motion-model noise: how much AMCL distrusts odometry between updates. All five
    # at 0.2 is a lot, and it does not match this robot — the odometry was measured
    # accurate to 1% in rotation (wheel and gyro agreeing over a 354 deg sweep) and
    # ~0.22 m over a 50 s drive. With noise that large the particle cloud spreads
    # aggressively every update and the measurement step then picks whichever particle
    # scores best; in a repetitive rectilinear apartment that is a random walk, which
    # showed up as the map->odom correction sliding ~80 deg over a single 60 s run
    # while the true heading error cannot have exceeded a few degrees.
    # Lowered to match the measured odometry quality.
    alpha1: 0.05   # rotation noise from rotation
    alpha2: 0.05   # rotation noise from translation
    alpha3: 0.05   # translation noise from translation
    alpha4: 0.05   # translation noise from rotation
    alpha5: 0.05   # strafe noise (omni model only)
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # Match the YDLidar X3's real usable range rather than the 100 m default, so the
    # likelihood field is not built over ranges the sensor cannot produce.
    laser_max_range: 8.0
    # Left at the -1.0 default (use the scan's own range_min). An earlier revision set
    # this to 0.40 to reject chassis self-returns, but a 360-degree coverage sweep on
    # 2026-08-08 found ZERO returns below 0.40 m at any bearing — the raised mount
    # (laser_joint z=0.191 m) already eliminated them. Filtering here would only throw
    # away real close-range structure that AMCL could otherwise localise against.
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # 60 (the Nav2 default) is thin for a small, feature-rich apartment: it left the
    # filter under-constrained enough to hop between hypotheses. /scan_fixed carries
    # 720 beams, so 180 is still only a quarter of them and costs little on the Orin.
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Both zero DISABLES AMCL's recovery behaviour. With an imperfect initial pose the
    # filter then has no mechanism to redistribute particles toward the true pose — it
    # wanders among bad local optima instead. Observed live: the map->odom correction
    # swinging from -17 deg to +89 deg over one 50 s drive, ending 3.6 m out while raw
    # odometry was within 0.22 m. These are the standard nav2 recovery values: the fast
    # and slow exponential averages of measurement likelihood, whose divergence triggers
    # injection of random particles.
    # Back to disabled (the nav2 default), deliberately.
    #
    # These were enabled to escape a wrong initial pose. That is no longer the failure
    # mode: with scripts/set_amcl_pose.py seeding from a verified pose, AMCL locks to
    # within ~3 cm. Recovery then does more harm than good — it injects random
    # particles whenever short-term match likelihood dips below long-term, and a dip is
    # routine (someone walks past, a chair moved since mapping, a specular dropout off
    # the fridge). Measured: with alphas at 0.05 the filter tracked stably for 16 s
    # (correction steady to 0.4 m / 6 deg), then recovery fired and teleported the pose
    # 6 m in one update.
    #
    # Trade-off accepted: AMCL can no longer self-recover from being kidnapped or badly
    # mislocalised. Re-seed manually instead — scripts/set_amcl_pose.py.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # OmniMotionModel is correct for holonomic (mecanum) robots.
    # DifferentialMotionModel (the DWA default) would produce bad localisation
    # because it assumes the robot can only move forward/backward.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # Consume the resampled scan for consistency with the map, which is built from
    # /scan_fixed by slam_toolbox. Raw /scan carries a variable beam count; AMCL
    # tolerates that, but localising against the same representation the map was
    # built from avoids any systematic difference between mapping and localisation.
    scan_topic: /scan_fixed
    save_pose_rate: 0.5
    # Width of the Gaussian around a map obstacle in the likelihood field. 0.2 m on a
    # 0.05 m map is very smooth: a 20 cm mismatch still scores as a good hit, so many
    # wrong poses score nearly as well as the right one and the filter cannot sharpen
    # past roughly that scale. Observed live: global relocalization plateaued at a
    # 1-sigma of 0.38 m / 18.6 deg and stopped improving. 0.1 m still tolerates the
    # X3's ranging noise while actually discriminating.
    sigma_hit: 0.1
    tf_broadcast: true
    # Seed the filter so it publishes map->odom immediately rather than waiting
    # silently for an /initialpose message (which presents as a hang).
    #
    # (0,0,0) is "where the robot stood when the mapping run began", since
    # slam_toolbox anchors the map frame there. That is ONLY correct if the robot
    # is actually parked at that spot. It is not a safe default otherwise: seeding
    # a wrong pose sent the filter into permanent divergence in testing.
    #
    # ALWAYS establish the pose properly before trusting localization — either
    # park at the mapping start point, set it with RViz's "2D Pose Estimate",
    # or call /reinitialize_global_localization and drive until the covariance
    # collapses (see scripts/relocalize.py).
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    # Beam-model mixture weights. These must sum to 1.0; the previous values summed to
    # 1.1, and more importantly z_hit=0.5 / z_rand=0.5 told AMCL that HALF of every
    # scan is uniform random noise. That flattens the likelihood field and is a direct
    # cause of the filter refusing to converge below ~0.38 m. The YDLidar against a
    # clean 5 cm map is far better than that: most beams really do hit mapped
    # structure, so weight z_hit accordingly and leave a small z_rand for the genuine
    # outliers (people, moved furniture, specular dropouts).
    z_hit: 0.85
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.05

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# ── Controller Server (MPPI) ────────────────────────────────────────────────
# MPPI samples many trajectory rollouts and picks the lowest-cost one.
# It naturally exploits the full holonomic envelope — diagonal motion,
# strafing, and in-place rotation — without needing hand-tuned sampling grids.
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # non-zero: holonomic, y matters
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.1
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.15
      vx_min: -0.15      # holonomic: allow reversing
      vy_max: 0.15       # holonomic: allow strafing
      wz_max: 0.6
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 1.0
      az_max: 1.5
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"   # Omni = holonomic (x, y, theta)
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PreferForwardCritic"
        - "DBaSCritic"
      DBaSCritic:
        enabled: true
        safe_radius: 0.6
        collision_cost: 100000.0
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.4
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.40
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: false   # disabled: MPPI Omni model handles heading natively

# ── Smoother Server (SavitzkyGolay) ────────────────────────────────────────
# Smooths the global plan before handing it to MPPI, removing grid staircase
# artefacts from SmacPlanner2D.
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      num_iterations: 2
      do_refinement: true
      refinement_num: 2

# ── Planner Server (SmacPlanner2D) ─────────────────────────────────────────
# SmacPlanner2D uses A* on an SE2 grid without orientation constraints, which
# is ideal for holonomic robots that can move in any direction.
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

# ── Costmaps ────────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.15   # slightly larger than DWA (0.1) for mecanum footprint
      plugins: ["obstacle_layer", "oak_voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          obstacle_min_range: 0.1
          clearing: True
          marking: True
          data_type: "LaserScan"
      # OAK-D Lite depth -> obstacles the lidar physically cannot see. The 4ROS
      # scan plane is horizontal at z = 0.191 m (urdf laser_joint rpy "0 0 pi"),
      # so tabletops, counters, chair seats and open drawers are invisible to
      # obstacle_layer above — it sees the table legs and plans into the top.
      # Needs the server started with --oak-cloud (publishes /oak/points).
      #
      # Ordered AFTER obstacle_layer so the lidar (accurate, 360 deg) is the
      # base truth and the camera (noisier, ~70 deg FOV) only adds to it.
      # If /oak/points is absent — no --oak-cloud, or no OAK-D — this layer
      # contributes nothing and lidar avoidance is unchanged. Degrades safe.
      oak_voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True    # /local_costmap/voxel_grid, for RViz debugging
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16               # VoxelLayer hard cap; 16 * 0.10 = 1.6 m tall
        # Column must hold >1 marked voxel to become a lethal cell. Single-voxel
        # marking turns isolated stereo speckle into phantom obstacles.
        mark_threshold: 1
        unknown_threshold: 15
        combination_method: 1      # max() with the layers below
        observation_sources: oak_points
        oak_points:
          topic: /oak/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # 0.05 m floor deadband: below this, stereo noise on a flat floor
          # marks the ground itself and the robot refuses to move.
          min_obstacle_height: 0.05
          max_obstacle_height: 1.60
          # Depth error grows ~0.006*z^2 (about 8 cm at 3.5 m). Mark closer than
          # we raytrace, so far points still clear stale cells without being
          # trusted enough to create new ones.
          obstacle_min_range: 0.30
          obstacle_max_range: 3.00
          raytrace_min_range: 0.0
          raytrace_max_range: 4.00
          # 0.0 disables the staleness warning: the OAK-D is optional hardware
          # and Nav2 would otherwise log continuously whenever it is absent.
          expected_update_rate: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.15
      resolution: 0.05
      # NOTE: the OAK-D voxel layer is deliberately local-costmap-only. The
      # camera's ~70 deg FOV can only raytrace-clear what it is currently
      # looking at, so on this (non-rolling) costmap a mis-measured obstacle
      # persists after the robot turns away and can permanently block a doorway
      # for the planner. The local costmap is rolling, so bad marks age out.
      # Consequence: the planner may still route through a table and the
      # controller deviates around it locally. If that proves too disruptive,
      # add oak_voxel_layer here too — but re-test doorway traversal first.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          raytrace_range: 3.0
          obstacle_min_range: 0.1
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.25
      always_send_full_costmap: True

# ── Map Server ───────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "yahboomcar.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

# ── Behavior Server ──────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ── Waypoint Follower ────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

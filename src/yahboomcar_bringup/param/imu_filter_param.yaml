# Params for imu_filter_madgwick_node (x3_bringup.launch.py).
#
# The key MUST match the node name or ROS 2 silently ignores every parameter here.
# This file previously keyed on `complementary_filter_gain_node` while the launch
# starts `imu_filter_madgwick` with no name remap — so none of it applied, and the
# node ran on its defaults. The visible symptom was a spurious `odom -> imu_link`
# transform (publish_tf defaults to true), which gave imu_link two parents: odom
# here and base_link from the URDF. `/**` is used deliberately so a future node
# rename cannot silently break this again; the file is passed to one node only.
/**:
  ros__parameters:
    # Do NOT publish a TF. robot_state_publisher already provides
    # base_link -> imu_link from the URDF; a second parent for the same frame is a
    # tf2 tree violation.
    publish_tf: false
    reverse_tf: false

    # Fuse gyro + accel only. The MPU9250's magnetometer is uncalibrated for hard
    # iron and swings wildly when the motors are energised — it "must not be used
    # for heading" until a calibration pass is done. Note this is currently belt
    # and braces: the EKF's imu0_config fuses only yaw RATE, not absolute
    # orientation, so the mag never reaches the fused heading anyway. Turning it
    # off keeps /imu/data itself honest for anything that does consume orientation.
    use_mag: false

    # ENU, per REP-103, matching the rest of the stack.
    world_frame: "enu"

    # Madgwick filter gain. 0.1 is the package default and is a reasonable
    # accel-trust for a ground robot; raise it if orientation lags, lower it if
    # orientation is noisy under vibration.
    gain: 0.1
    zeta: 0.0

    # Derive dt from message timestamps rather than assuming a fixed rate.
    constant_dt: 0.0
    publish_debug_topics: false

    qos_overrides:
      /imu/data_raw:
        subscription:
          depth: 10
          durability: volatile
          history: keep_last
          reliability: reliable

      /imu/mag:
        subscription:
          depth: 10
          durability: volatile
          history: keep_last
          reliability: reliable

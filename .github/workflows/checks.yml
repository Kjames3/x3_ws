name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:   # lets you run it by hand from the Actions tab

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # install/ holds colcon-GENERATED setup scripts (install/setup.sh,
      # install/local_setup.sh). They are build output, not source, and they do
      # not pass lint — exclude them rather than editing generated files.
      - name: Collect scripts
        id: collect
        run: |
          mapfile -t files < <(git ls-files '*.sh' | grep -v '^install/')
          printf '  %s\n' "${files[@]}"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${files[@]}" > /tmp/sh_files.txt

      # Syntax check. Catches things shellcheck deliberately will not, since
      # shellcheck is a linter rather than a parser for every construct.
      - name: bash -n (syntax)
        run: xargs -a /tmp/sh_files.txt -d '\n' -I{} bash -n {}

      # The gate. Severity is 'warning'; suppressions live in .shellcheckrc with
      # the reasoning for each. Anything at warning or above fails the build.
      - name: shellcheck (gate, severity=warning)
        run: xargs -a /tmp/sh_files.txt -d '\n' shellcheck --severity=warning --format=gcc

      # Informational only — info/style findings are printed for visibility but
      # never fail the build. Tighten the gate above if you want these enforced.
      - name: shellcheck (info/style, non-blocking)
        if: always()
        run: |
          xargs -a /tmp/sh_files.txt -d '\n' shellcheck --format=gcc || true

  large-files:
    name: large files / rosbag guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for oversized files and committed rosbags
        run: ./scripts/ci/check_large_files.sh

  pytest:
    name: pytest (offline tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 3.10 is what the Jetson (Ubuntu 22.04) and the laptop run.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      # Catches a syntax error in any script, including the ROS and hardware
      # ones that no test imports.
      - name: Byte-compile sources
        run: python -m compileall -q src/*.py scripts/*.py tests

      # No ROS here: tests that need rclpy, onnxruntime or mediapipe skip
      # themselves. -rs prints the skip reasons so a silent skip is visible.
      - name: pytest
        run: python -m pytest tests -q -rs

  web:
    name: web GUI (syntax + humanoid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check
        run: |
          for f in src/web/*.js src/web/models/*.js; do
            node --check "$f"
          done

      # Same three.js release GUI.html loads from the CDN.
      - name: Humanoid walk-cycle test
        run: |
          npm install --no-save --prefix /tmp/three three@0.128.0
          NODE_PATH=/tmp/three/node_modules node tests/test_humanoid_walk.cjs
